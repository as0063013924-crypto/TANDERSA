<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  
<!-- TANDERSA PWA CONFIGURATION -->

<meta name="application-name" content="تندرسا">
<meta name="description" content="مدیریت هوشمند تغذیه و سبک زندگی">

<meta name="theme-color" content="#701C3C">

<link rel="manifest" href="./manifest.json">

<link
  rel="icon"
  type="image/png"
  sizes="192x192"
  href="./icon-192.png"
>

<link
  rel="apple-touch-icon"
  href="./icon-192.png"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تندرسا">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

  
  
  
  
  
  
  <title>تندرسا | TANDERSA - مدیریت هوشمند تغذیه و سبک زندگی</title>
  
  <script>
    // جلوگیری از چشمک‌زدن تم هنگام بارگذاری اولیه
    (function () {
      try {
        const savedTheme = localStorage.getItem('tandersa_v1_theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    :root {
      --brand-primary: #701C3C;
      --brand-primary-hover: #58142E;
      --brand-soft: #F5DDE5;
      --brand-gold: #D5AD62;
      --brand-gold-dark: #B68D40;
      --bg-app: #FFF9F6;
      --bg-surface: #FFFFFF;
      --bg-muted: #F9EEF1;
      --text-main: #23141A;
      --text-muted: #66525A;
      --border-color: #EAD7DE;
      --shadow-sm: 0 2px 8px rgba(112, 28, 60, 0.06);
      --shadow-md: 0 8px 24px rgba(112, 28, 60, 0.10);
      --success: #1E7E53;
      --success-bg: #E6F6EE;
      --warning: #9C6500;
      --warning-bg: #FFF5E0;
      --danger: #B42318;
      --danger-bg: #FEECEB;
      --info: #1D4ED8;
      --info-bg: #EFF6FF;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --focus-ring: 0 0 0 3px rgba(213, 173, 98, 0.55);
    }

    [data-theme="dark"] {
      --brand-primary: #C84B7A;
      --brand-primary-hover: #DF6392;
      --brand-soft: #361A26;
      --brand-gold: #E0BA70;
      --brand-gold-dark: #C89F52;
      --bg-app: #150E11;
      --bg-surface: #21161B;
      --bg-muted: #2B1D23;
      --text-main: #FAF3F6;
      --text-muted: #C2AEB6;
      --border-color: #3D2831;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
      --success: #4ADE80;
      --success-bg: #132E22;
      --warning: #FBBF24;
      --warning-bg: #33250C;
      --danger: #F87171;
      --danger-bg: #381616;
      --info: #60A5FA;
      --info-bg: #15253D;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
      font-family: Tahoma, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.65;
      font-size: 14px;
      -webkit-tap-highlight-color: transparent;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    button, input, select, textarea {
      font-family: Tahoma, Arial, sans-serif;
      font-size: 14px;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      min-height: 44px;
      min-width: 44px;
      border-radius: var(--radius-sm);
      transition: background-color 0.18s ease, transform 0.12s ease, border-color 0.18s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    /* چیدمان اصلی برنامه */
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    .sidebar {
      display: none;
    }

    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding-bottom: 84px;
    }

    @media (min-width: 960px) {
      .sidebar {
        display: flex;
        flex-direction: column;
        width: 268px;
        flex-shrink: 0;
        background-color: var(--bg-surface);
        border-left: 1px solid var(--border-color);
        padding: 20px 14px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }
      .main-wrapper {
        padding-bottom: 28px;
      }
      .bottom-nav {
        display: none !important;
      }
    }

    /* هدر بالا */
    .topbar {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-title-group {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand-name {
      font-weight: bold;
      font-size: 16px;
      color: var(--brand-primary);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .brand-en {
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--brand-gold-dark);
      font-weight: bold;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      background-color: var(--bg-muted);
      color: var(--brand-primary);
      border: 1px solid var(--border-color);
    }

    .icon-btn:hover {
      background-color: var(--brand-soft);
    }

    /* منوی کناری دسکتاپ */
    .side-nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 20px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-weight: bold;
      text-align: right;
      width: 100%;
    }

    .nav-item:hover {
      background-color: var(--bg-muted);
      color: var(--text-main);
    }

    .nav-item.active {
      background-color: var(--brand-primary);
      color: #FFFFFF;
    }

    /* منوی پایین موبایل (۵ گزینه اصلی) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      right: 0;
      left: 0;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 4px;
      z-index: 40;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06);
    }

    .bottom-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 2px;
      font-size: 11px;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      min-width: 0;
    }

    .bottom-nav-btn span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .bottom-nav-btn.active {
      color: var(--brand-primary);
      background-color: var(--brand-soft);
      font-weight: bold;
    }

    /* محتوای اصلی */
    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px;
    }

    @media (min-width: 640px) {
      .container {
        padding: 22px;
      }
    }

    /* کارت‌ها و شبکه‌ها */
    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
      min-width: 0;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .card-title {
      font-size: 15px;
      font-weight: bold;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 640px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
      .grid-4 { grid-template-columns: repeat(4, 1fr); gap: 14px; }
    }

    @media (min-width: 900px) {
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
    }

    /* دکمه‌ها */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      font-weight: bold;
      border-radius: var(--radius-sm);
      text-align: center;
    }

    .btn-primary {
      background-color: var(--brand-primary);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--brand-primary-hover);
    }

    .btn-gold {
      background-color: var(--brand-gold);
      color: #23141A;
    }

    .btn-gold:hover {
      background-color: var(--brand-gold-dark);
      color: #FFFFFF;
    }

    .btn-soft {
      background-color: var(--brand-soft);
      color: var(--brand-primary);
    }

    .btn-soft:hover {
      filter: brightness(0.96);
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background-color: var(--bg-muted);
    }

    .btn-danger {
      background-color: var(--danger-bg);
      color: var(--danger);
      border: 1px solid currentColor;
    }

    .btn-sm {
      padding: 6px 12px;
      min-height: 36px;
      font-size: 12px;
    }

    /* فرم‌ها */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-label {
      font-weight: bold;
      font-size: 13px;
      color: var(--text-main);
    }

    .form-hint {
      font-size: 11px;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background-color: var(--bg-app);
      color: var(--text-main);
    }

    .form-control.invalid {
      border-color: var(--danger);
      background-color: var(--danger-bg);
    }

    .field-error {
      font-size: 12px;
      color: var(--danger);
      font-weight: bold;
    }

    /* نشانگرها و پیام‌ها */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      background-color: var(--brand-soft);
      color: var(--brand-primary);
    }

    .badge-gold {
      background-color: rgba(213, 173, 98, 0.22);
      color: var(--brand-gold-dark);
    }

    [data-theme="dark"] .badge-gold {
      color: var(--brand-gold);
    }

    .alert-box {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 14px;
      font-size: 13px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border: 1px solid transparent;
    }

    .alert-info { background-color: var(--info-bg); color: var(--info); border-color: rgba(29, 78, 216, 0.25); }
    .alert-warning { background-color: var(--warning-bg); color: var(--warning); border-color: rgba(156, 101, 0, 0.25); }
    .alert-success { background-color: var(--success-bg); color: var(--success); border-color: rgba(30, 126, 83, 0.25); }
    .alert-danger { background-color: var(--danger-bg); color: var(--danger); border-color: rgba(180, 35, 24, 0.25); }

    /* نوار پیشرفت */
    .progress-track {
      width: 100%;
      height: 10px;
      background-color: var(--bg-muted);
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--brand-primary), var(--brand-gold));
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* کارت‌های آمار داشبورد */
    .stat-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: bold;
      color: var(--brand-primary);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* تب‌های داخلی */
    .tabs-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
    }

    .tab-pill {
      padding: 8px 14px;
      border-radius: 999px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      white-space: nowrap;
      font-size: 13px;
      min-height: 38px;
    }

    .tab-pill.active {
      background-color: var(--brand-primary);
      color: #FFFFFF;
      border-color: var(--brand-primary);
      font-weight: bold;
    }

    /* کارت غذا */
    .food-item-card {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px;
      background-color: var(--bg-surface);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .food-top {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .food-thumb {
      width: 54px;
      height: 54px;
      border-radius: var(--radius-sm);
      background-color: var(--brand-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--brand-primary);
    }

    .macro-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background-color: var(--bg-muted);
      padding: 6px;
      border-radius: var(--radius-sm);
      text-align: center;
      font-size: 11px;
    }

    .macro-row strong {
      display: block;
      font-size: 12px;
      color: var(--text-main);
    }

    /* تقویم */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }

    .cal-day-header {
      font-size: 11px;
      font-weight: bold;
      color: var(--text-muted);
      padding: 6px 0;
    }

    .cal-cell {
      min-height: 44px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background-color: var(--bg-app);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      position: relative;
      padding: 4px 2px;
    }

    .cal-cell.selected {
      background-color: var(--brand-primary);
      color: #FFFFFF;
      border-color: var(--brand-primary);
      font-weight: bold;
    }

    .cal-cell.has-data::after {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--brand-gold);
      margin-top: 2px;
    }

    .cal-cell.empty {
      border: none;
      background: transparent;
      pointer-events: none;
    }

    /* مودال و دیالوگ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 8, 11, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }

    .modal-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: var(--shadow-md);
    }

    /* Toast پیام زنده */
    .toast-container {
      position: fixed;
      top: 72px;
      left: 16px;
      right: 16px;
      z-index: 70;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      background-color: var(--text-main);
      color: var(--bg-surface);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: bold;
      box-shadow: var(--shadow-md);
      max-width: 420px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* خوشامدگویی */
    .onboarding-wrap {
      max-width: 680px;
      margin: 18px auto;
      padding: 16px;
    }

    .hero-banner {
      background: linear-gradient(135deg, var(--brand-primary) 0%, #4A1026 100%);
      color: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }

    .hero-banner h1 {
      font-size: 21px;
      margin-bottom: 6px;
    }

    .hero-slogan {
      color: #F7D99E;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 8px;
    }

    /* نمودارهای SVG */
    .chart-box {
      width: 100%;
      overflow: hidden;
      padding-top: 6px;
    }

    .empty-state {
      text-align: center;
      padding: 28px 16px;
      color: var(--text-muted);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--bg-app);
    }

    .empty-state p {
      margin: 8px 0 14px;
    }

    .hidden {
      display: none !important;
    }

    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .flex-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .text-muted { color: var(--text-muted); }
    .text-sm { font-size: 12px; }
    .text-xs { font-size: 11px; }
    .font-bold { font-weight: bold; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 14px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 14px; }
  </style>
</head>
<body>
  <div id="toastRegion" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div id="modalRegion"></div>
  <div id="appRoot"></div>

  <script>
    'use strict';

    /* =========================================================================
       ۱. آیکون‌های اختصاصی Inline SVG (لوگوی تندرسا + آیکون‌های رابط کاربری)
       ========================================================================= */
    const ICONS = {
      logo: `<svg width="36" height="36" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect width="48" height="48" rx="14" fill="#701C3C"/>
        <path d="M24 9C24 9 13 20.5 13 28.5C13 34.5751 17.9249 39.5 24 39.5C30.0751 39.5 35 34.5751 35 28.5C35 20.5 24 9 24 9Z" fill="#F5DDE5"/>
        <path d="M24 15C28.5 19.5 30.5 24.5 29.2 30.2C27.8 34.2 24 36 24 36C24 36 20.8 31.8 21.8 25.8C22.5 21.5 24 15 24 15Z" fill="#D5AD62"/>
        <path d="M18 29L22 33L31 23" stroke="#701C3C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    /* =========================================================================
       ۳. لایه ذخیره‌سازی محلی (IndexedDB نسخه‌بندی‌شده + LocalStorage تنظیمات)
       ========================================================================= */
    const DB_NAME = 'TandersaLocalDB_v1';
    const DB_VERSION = 1;
    const LS_KEYS = {
      theme: 'tandersa_v1_theme',
      unitSystem: 'tandersa_v1_units',
      waterReminder: 'tandersa_v1_water_reminder',
      favoriteFoods: 'tandersa_v1_fav_foods'
    };

    const StorageService = {
      db: null,

      init() {
        return new Promise((resolve, reject) => {
          if (!('indexedDB' in window)) {
            reject(new Error('مرورگر شما از IndexedDB پشتیبانی نمی‌کند.'));
            return;
          }
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('profile')) {
              db.createObjectStore('profile', { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains('foodLogs')) {
              const s = db.createObjectStore('foodLogs', { keyPath: 'id' });
              s.createIndex('date', 'date', { unique: false });
            }
            if (!db.objectStoreNames.contains('waterLogs')) {
              const s = db.createObjectStore('waterLogs', { keyPath: 'id' });
              s.createIndex('date', 'date', { unique: false });
            }
            if (!db.objectStoreNames.contains('activityLogs')) {
              const s = db.createObjectStore('activityLogs', { keyPath: 'id' });
              s.createIndex('date', 'date', { unique: false });
            }
            if (!db.objectStoreNames.contains('weightLogs')) {
              const s = db.createObjectStore('weightLogs', { keyPath: 'id' });
              s.createIndex('date', 'date', { unique: false });
            }
          };
          req.onsuccess = (e) => {
            this.db = e.target.result;
            resolve(this.db);
          };
          req.onerror = () => reject(new Error('خطا در باز کردن پایگاه داده محلی IndexedDB.'));
        });
      },

      tx(storeName, mode, operation) {
        return new Promise((resolve, reject) => {
          try {
            const transaction = this.db.transaction(storeName, mode);
            const store = transaction.objectStore(storeName);
            const request = operation(store);
            transaction.oncomplete = () => resolve(request ? request.result : true);
            transaction.onerror = () => reject(new Error('خطا در تراکنش ذخیره‌سازی محلی.'));
          } catch (err) {
            reject(err);
          }
        });
      },

      getProfile() {
        return this.tx('profile', 'readonly', (store) => store.get('main_user'));
      },

      saveProfile(profileObj) {
        return this.tx('profile', 'readwrite', (store) => store.put({ ...profileObj, id: 'main_user' }));
      },

      getAll(storeName) {
        return this.tx(storeName, 'readonly', (store) => store.getAll());
      },

      putItem(storeName, item) {
        return this.tx(storeName, 'readwrite', (store) => store.put(item));
      },

      deleteItem(storeName, id) {
        return this.tx(storeName, 'readwrite', (store) => store.delete(id));
      },

      clearAllStores() {
        const stores = ['profile', 'foodLogs', 'waterLogs', 'activityLogs', 'weightLogs'];
        return new Promise((resolve, reject) => {
          try {
            const transaction = this.db.transaction(stores, 'readwrite');
            stores.forEach((name) => transaction.objectStore(name).clear());
            transaction.oncomplete = () => resolve(true);
            transaction.onerror = () => reject(new Error('خطا در پاک‌سازی پایگاه داده.'));
          } catch (e) {
            reject(e);
          }
        });
      },

      getSetting(key, fallback) {
        try {
          const val = localStorage.getItem(key);
          return val !== null ? JSON.parse(val) : fallback;
        } catch (e) {
          return fallback;
        }
      },

      setSetting(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {
          console.warn('خطا در ذخیره تنظیمات LocalStorage:', e);
        }
      }
    };

    /* =========================================================================
       ۴. توابع کمکی تاریخ، فرمت‌دهی و محاسبات ایمن سلامتی
       ========================================================================= */
    function getTodayISO() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function shiftDateISO(isoDate, daysDelta) {
      const [y, m, d] = isoDate.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + daysDelta);
      const ny = dt.getFullYear();
      const nm = String(dt.getMonth() + 1).padStart(2, '0');
      const nd = String(dt.getDate()).padStart(2, '0');
      return `${ny}-${nm}-${nd}`;
    }

    function formatPersianDate(isoDate) {
      try {
        const [y, m, d] = isoDate.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        return new Intl.DateTimeFormat('fa-IR', {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        }).format(dt);
      } catch (e) {
        return isoDate;
      }
    }

    function toPersianDigits(num) {
      if (num === null || num === undefined) return '';
      const persian = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
      return String(num).replace(/\d/g, (d) => persian[Number(d)]);
    }

    function round1(val) {
      return Math.round((Number(val) || 0) * 10) / 10;
    }

    function generateId(prefix) {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    }

    /* محاسبات شاخص‌ها با رعایت کامل ایمنی گروه سنی زیر ۱۸ سال */
    function evaluateHealthMetrics(profile) {
      if (!profile) return null;
      const age = Number(profile.age);
      const heightCm = Number(profile.height);
      const weightKg = Number(profile.weight);
      const isMinor = age < 18;

      // نیاز آب تخمینی بر اساس وزن (حدود ۳۰ میلی‌لیتر به ازای هر کیلوگرم، حداقل ۱۵۰۰ و حداکثر ۳۵۰۰)
      const suggestedWaterMl = Math.min(3500, Math.max(1500, Math.round((weightKg * 30) / 50) * 50));

      if (isMinor) {
        return {
          isMinor: true,
          bmi: null,
          bmiCategory: null,
          estimatedEnergy: null,
          suggestedWaterMl
        };
      }

      const heightM = heightCm / 100;
      const bmi = round1(weightKg / (heightM * heightM));
      let bmiCategory = 'در محدوده متعادل غربالگری';
      if (bmi < 18.5) bmiCategory = 'کمتر از محدوده متعادل غربالگری';
      else if (bmi >= 25 && bmi < 30) bmiCategory = 'بالاتر از محدوده متعادل غربالگری';
      else if (bmi >= 30) bmiCategory = 'محدوده نیازمند بررسی تخصصی';

      // برآورد پایه انرژی روزانه (فرمول تخمینی عمومی بدون ادعای پزشکی)
      const activityFactorMap = {
        sedentary: 1.2,
        light: 1.375,
        moderate: 1.55,
        active: 1.725
      };
      const factor = activityFactorMap[profile.activityLevel] || 1.375;
      const baseBmr = (10 * weightKg) + (6.25 * heightCm) - (5 * age) - 78;
      const estimatedEnergy = Math.round((baseBmr * factor) / 10) * 10;

      return {
        isMinor: false,
        bmi,
        bmiCategory,
        estimatedEnergy,
        suggestedWaterMl
      };
    }

    /* =========================================================================
       ۶. سیستم پیام‌های زنده (Toast) و پنجره‌های تأیید/فرم (Modal)
       ========================================================================= */
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastRegion');
      const toast = document.createElement('div');
      toast.className = 'toast';
      if (type === 'success') toast.style.backgroundColor = 'var(--success)';
      if (type === 'danger') toast.style.backgroundColor = 'var(--danger)';

      const span = document.createElement('span');
      span.textContent = message;

      const closeBtn = document.createElement('button');
      closeBtn.textContent = 'بستن';
      closeBtn.style.color = '#FFFFFF';
      closeBtn.style.minHeight = '30px';
      closeBtn.style.padding = '2px 8px';
      closeBtn.style.fontSize = '12px';
      closeBtn.onclick = () => toast.remove();

      toast.appendChild(span);
      toast.appendChild(closeBtn);
      container.appendChild(toast);

      setTimeout(() => {
        if (toast.parentNode) toast.remove();
      }, 4000);
    }

    function openModal({ title, buildBody, onConfirm, confirmText = 'تأیید', confirmClass = 'btn-primary', showCancel = true }) {
      const region = document.getElementById('modalRegion');
      region.innerHTML = '';

      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.setAttribute('role', 'dialog');
      backdrop.setAttribute('aria-modal', 'true');

      const card = document.createElement('div');
      card.className = 'modal-card';

      const header = document.createElement('div');
      header.className = 'flex-between mb-3';

      const h3 = document.createElement('h3');
      h3.style.fontSize = '16px';
      h3.textContent = title;

      const closeX = document.createElement('button');
      closeX.className = 'icon-btn';
      closeX.setAttribute('aria-label', 'بستن پنجره');
      closeX.textContent = '✕';
      closeX.onclick = closeModal;

      header.appendChild(h3);
      header.appendChild(closeX);
      card.appendChild(header);

      const bodyWrap = document.createElement('div');
      buildBody(bodyWrap);
      card.appendChild(bodyWrap);

      const footer = document.createElement('div');
      footer.className = 'flex-row mt-3';
      footer.style.justifyContent = 'flex-end';

      if (showCancel) {
        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'btn btn-outline';
        cancelBtn.textContent = 'انصراف';
        cancelBtn.onclick = closeModal;
        footer.appendChild(cancelBtn);
      }

      if (onConfirm) {
        const okBtn = document.createElement('button');
        okBtn.type = 'button';
        okBtn.className = `btn ${confirmClass}`;
        okBtn.textContent = confirmText;
        okBtn.onclick = () => {
          const shouldClose = onConfirm();
          if (shouldClose !== false) closeModal();
        };
        footer.appendChild(okBtn);
      }

      card.appendChild(footer);
      backdrop.appendChild(card);
      region.appendChild(backdrop);

      backdrop.addEventListener('click', (e) => {
        if (e.target === backdrop) closeModal();
      });
    }

    function closeModal() {
      const region = document.getElementById('modalRegion');
      region.innerHTML = '';
    }

    function setupWaterReminderTimer() {
      if (state.reminderTimerId) {
        clearInterval(state.reminderTimerId);
        state.reminderTimerId = null;
      }
      const rem = state.settings.waterReminder;
      if (rem && rem.enabled && Number(rem.intervalMin) >= 15) {
        state.reminderTimerId = setInterval(() => {
          showToast('یادآور تندرسا: زمان نوشیدن یک لیوان آب گوارا فرا رسیده است!', 'info');
        }, Number(rem.intervalMin) * 60 * 1000);
      }
    }

    /* =========================================================================
       ۸. رندر نمودارهای تعاملی و واکنش‌گرا با Inline SVG (بدون کتابخانه خارجی)
       ========================================================================= */
    function createBarChartSVG(dataPoints, unitLabel, barColor = '#701C3C') {
      // dataPoints: [{ label: 'شنبه', value: 1500, fullDate: '2026-...' }]
      const width = 560;
      const height = 210;
      const padLeft = 38;
      const padRight = 16;
      const padTop = 20;
      const padBottom = 38;
      const chartW = width - padLeft - padRight;
      const chartH = height - padTop - padBottom;

      const maxVal = Math.max(...dataPoints.map((d) => d.value), 10);
      const count = dataPoints.length || 1;
      const slotW = chartW / count;
      const barW = Math.min(34, slotW * 0.56);

      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', 'auto');
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', `نمودار ${unitLabel}`);

      // خطوط راهنمای افقی
      [0, 0.5, 1].forEach((ratio) => {
        const y = padTop + chartH - ratio * chartH;
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', padLeft);
        line.setAttribute('x2', width - padRight);
        line.setAttribute('y1', y);
        line.setAttribute('y2', y);
        line.setAttribute('stroke', 'var(--border-color)');
        line.setAttribute('stroke-dasharray', ratio === 0 ? '0' : '4 4');
        svg.appendChild(line);

        const txt = document.createElementNS(svgNS, 'text');
        txt.setAttribute('x', padLeft - 6);
        txt.setAttribute('y', y + 4);
        txt.setAttribute('text-anchor', 'end');
        txt.setAttribute('font-size', '10');
        txt.setAttribute('fill', 'var(--text-muted)');
        txt.textContent = toPersianDigits(Math.round(maxVal * ratio));
        svg.appendChild(txt);
      });

      dataPoints.forEach((pt, idx) => {
        const barH = (pt.value / maxVal) * chartH;
        const x = padLeft + idx * slotW + (slotW - barW) / 2;
        const y = padTop + chartH - barH;

        const rect = document.createElementNS(svgNS, 'rect');
        rect.setAttribute('x', x);
        rect.setAttribute('y', y);
        rect.setAttribute('width', barW);
        rect.setAttribute('height', Math.max(barH, pt.value > 0 ? 4 : 0));
        rect.setAttribute('rx', '5');
        rect.setAttribute('fill', barColor);
        svg.appendChild(rect);

        if (pt.value > 0) {
          const valTxt = document.createElementNS(svgNS, 'text');
          valTxt.setAttribute('x', x + barW / 2);
          valTxt.setAttribute('y', y - 5);
          valTxt.setAttribute('text-anchor', 'middle');
          valTxt.setAttribute('font-size', '10');
          valTxt.setAttribute('font-weight', 'bold');
          valTxt.setAttribute('fill', 'var(--text-main)');
          valTxt.textContent = toPersianDigits(pt.value);
          svg.appendChild(valTxt);
        }

        const lbl = document.createElementNS(svgNS, 'text');
        lbl.setAttribute('x', x + barW / 2);
        lbl.setAttribute('y', height - 12);
        lbl.setAttribute('text-anchor', 'middle');
        lbl.setAttribute('font-size', '10');
        lbl.setAttribute('fill', 'var(--text-muted)');
        lbl.textContent = pt.label;
        svg.appendChild(lbl);
      });

      return svg;
    }

      function checkAgeRule() {
        const ageVal = Number(ageInput.value);
        if (ageVal > 0 && ageVal < 18) {
          minorBox.classList.remove('hidden');
          // حذف گزینه مدیریت وزن برای افراد زیر ۱۸ سال
          Array.from(goalSelect.options).forEach((opt) => {
            if (opt.value.includes('وزن')) opt.disabled = true;
          });
          if (goalSelect.value.includes('وزن')) {
            goalSelect.value = 'تغذیه سالم و افزایش انرژی';
          }
        } else {
          minorBox.classList.add('hidden');
          Array.from(goalSelect.options).forEach((opt) => {
            opt.disabled = false;
          });
        }
      }

      ageInput.addEventListener('input', checkAgeRule);
      checkAgeRule();

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        let valid = true;

        const age = Number(form.querySelector('#pf_age').value);
        const height = Number(form.querySelector('#pf_height').value);
        const weight = Number(form.querySelector('#pf_weight').value);

        const errAge = form.querySelector('#err_age');
        const errHeight = form.querySelector('#err_height');
        const errWeight = form.querySelector('#err_weight');

        [errAge, errHeight, errWeight].forEach((el) => el.classList.add('hidden'));
        [form.querySelector('#pf_age'), form.querySelector('#pf_height'), form.querySelector('#pf_weight')].forEach((inp) => inp.classList.remove('invalid'));

        if (!age || age < 5 || age > 115) {
          errAge.textContent = 'لطفاً سن معتبر بین ۵ تا ۱۱۵ سال وارد کنید.';
          errAge.classList.remove('hidden');
          form.querySelector('#pf_age').classList.add('invalid');
          valid = false;
        }
        if (!height || height < 80 || height > 240) {
          errHeight.textContent = 'لطفاً قد معتبر بین ۸۰ تا ۲۴۰ سانتی‌متر وارد کنید.';
          errHeight.classList.remove('hidden');
          form.querySelector('#pf_height').classList.add('invalid');
          valid = false;
        }
        if (!weight || weight < 15 || weight > 300) {
          errWeight.textContent = 'لطفاً وزن معتبر بین ۱۵ تا ۳۰۰ کیلوگرم وارد کنید.';
          errWeight.classList.remove('hidden');
          form.querySelector('#pf_weight').classList.add('invalid');
          valid = false;
        }

        if (!valid) {
          showToast('لطفاً خطاهای مشخص‌شده در فرم را اصلاح کنید.', 'danger');
          return;
        }

        const sanitizedGoal = age < 18 && goalSelect.value.includes('وزن')
          ? 'تغذیه سالم و رشد متعادل (با نظر متخصص سلامت کودکان)'
          : goalSelect.value;

        onSubmitValid({
          name: form.querySelector('#pf_name').value.trim(),
          age,
          height,
          weight,
          activityLevel: form.querySelector('#pf_activity').value,
          dietPreference: form.querySelector('#pf_pref').value,
          allergies: form.querySelector('#pf_allergies').value.trim(),
          healthGoal: sanitizedGoal,
          updatedAt: Date.now()
        });
      });

      return form;
    }

    /* =========================================================================
       ۱۰. محاسبه خلاصه روزانه برای یک تاریخ مشخص
       ========================================================================= */
    function getDailySummary(dateISO) {
      const foods = state.foodLogs.filter((f) => f.date === dateISO);
      const waters = state.waterLogs.filter((w) => w.date === dateISO);
      const activities = state.activityLogs.filter((a) => a.date === dateISO);

      const nutrition = foods.reduce(
        (acc, item) => {
          acc.calories += Number(item.calories) || 0;
          acc.protein += Number(item.protein) || 0;
          acc.carbs += Number(item.carbs) || 0;
          acc.fat += Number(item.fat) || 0;
          acc.fiber += Number(item.fiber) || 0;
          return acc;
        },
        { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 }
      );

      const totalWaterMl = waters.reduce((sum, w) => sum + (Number(w.amountMl) || 0), 0);
      const totalActivityMin = activities.reduce((sum, a) => sum + (Number(a.durationMin) || 0), 0);
      const distinctMeals = new Set(foods.map((f) => f.mealType)).size;

      return {
        foods,
        waters,
        activities,
        nutrition: {
          calories: Math.round(nutrition.calories),
          protein: round1(nutrition.protein),
          carbs: round1(nutrition.carbs),
          fat: round1(nutrition.fat),
          fiber: round1(nutrition.fiber)
        },
        totalWaterMl,
        totalActivityMin,
        distinctMeals
      };
    }

      // کارت شاخص‌های سلامتی و ثبت سریع فعالیت بدنی

    function openActivityModal(dateISO) {
      openModal({
        title: 'ثبت فعالیت بدنی',
        buildBody: (body) => {
          body.innerHTML = `
            <div class="form-group">
              <label class="form-label" for="act_title">نوع فعالیت *</label>
              <input id="act_title" class="form-control" type="text" maxlength="50" placeholder="مثلاً: پیاده‌روی تند، دوچرخه‌سواری، شنا" value="پیاده‌روی" />
            </div>
            <div class="form-group">
              <label class="form-label" for="act_min">مدت زمان (دقیقه) *</label>
              <input id="act_min" class="form-control" type="number" min="5" max="480" value="30" />
            </div>
          `;
        },
        confirmText: 'ثبت فعالیت',
        onConfirm: async () => {
          const title = document.getElementById('act_title').value.trim();
          const durationMin = Number(document.getElementById('act_min').value);
          if (!title || !durationMin || durationMin < 1 || durationMin > 600) {
            showToast('لطفاً عنوان و مدت معتبر وارد کنید.', 'danger');
            return false;
          }
          const item = {
            id: generateId('act'),
            date: dateISO,
            title,
            durationMin,
            createdAt: Date.now()
          };
          await StorageService.putItem('activityLogs', item);
          state.activityLogs.push(item);
          showToast('فعالیت بدنی با موفقیت ثبت شد.', 'success');
          renderApp();
        }
      });
    }

    /* =========================================================================
       ۱۲. صفحه ثبت غذا و بانک اطلاعاتی تغذیه (Food Logger & Database)

            <span class="stat-label">انرژی تقریبی</span>

          </div>
          <div class="stat-card">
            <span class="stat-label">پروتئین</span>
            <span class="stat-value">${toPersianDigits(daily.nutrition.protein)} <span class="text-xs">گرم</span></span>

          <div class="stat-card">
            <span class="stat-label">کربوهیدرات</span>
            <span class="stat-value">${toPersianDigits(daily.nutrition.carbs)} <span class="text-xs">گرم</span></span>
          </div>
          <div class="stat-card">
            <span class="stat-label">چربی / فیبر</span>
            <span class="stat-value">${toPersianDigits(daily.nutrition.fat)} / ${toPersianDigits(daily.nutrition.fiber)} <span class="text-xs">گرم</span></span>
          </div>

        <div id="loggedMealsContainer"></div>
      `;

      // نمایش وعده‌های ثبت‌شده (صبحانه، ناهار، شام، میان‌وعده)

      if (daily.foods.length === 0) {
        mealsWrap.innerHTML = `<div class="empty-state"><p>هنوز غذایی برای این تاریخ ثبت نشده است. از بانک اطلاعاتی زیر غذا انتخاب و ثبت کنید.</p></div>`;

            itemRow.style.border = '1px solid var(--border-color)';
            itemRow.style.borderRadius = '10px';
            itemRow.style.marginBottom = '8px';
            itemRow.style.backgroundColor = 'var(--bg-app)';

            const titleEl = document.createElement('div');

            <select id="foodSortSel" class="form-control">
              <option value="name">بر اساس حروف الفبا</option>
              <option value="caloriesAsc">کم‌ترین انرژی تقریبی</option>
              <option value="caloriesDesc">بیشترین انرژی تقریبی</option>
              <option value="proteinDesc">بیشترین پروتئین</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0;justify-content:flex-end;">
            <button type="button" id="toggleFavFilterBtn" class="btn ${state.foodFilter.onlyFavorites ? 'btn-primary' : 'btn-outline'}">
              ${ICONS.heart} فقط غذاهای موردعلاقه (${toPersianDigits(state.settings.favorites.length)})
            </button>
          </div>
        </div>
        <div class="tabs-bar mt-2" id="foodCatTabs"></div>

      searchInp.oninput = (e) => {

        state.foodFilter.onlyFavorites = !state.foodFilter.onlyFavorites;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `tab-pill ${state.foodFilter.category === cat ? 'active' : ''}`;
        btn.textContent = cat;
        btn.onclick = () => {
          state.foodFilter.category = cat;
          renderApp();
        };
        catTabs.appendChild(btn);
      });

      renderFoodResultsList(dbCard.querySelector('#foodDbResults'));
    }

    function renderFoodResultsList(gridEl) {
      gridEl.innerHTML = '';
      const q = state.foodFilter.search.trim().toLowerCase();
      let list = FOOD_DB.filter((item) => {
        const matchCat = state.foodFilter.category === 'همه' || item.category === state.foodFilter.category;
        const matchQ = !q || item.name.toLowerCase().includes(q) || item.category.toLowerCase().includes(q);
        const matchFav = !state.foodFilter.onlyFavorites || state.settings.favorites.includes(item.id);
        return matchCat && matchQ && matchFav;
      });

      if (state.foodFilter.sortBy === 'caloriesAsc') list.sort((a, b) => a.calories - b.calories);
      else if (state.foodFilter.sortBy === 'caloriesDesc') list.sort((a, b) => b.calories - a.calories);
      else if (state.foodFilter.sortBy === 'proteinDesc') list.sort((a, b) => b.protein - a.protein);
      else list.sort((a, b) => a.name.localeCompare(b.name, 'fa'));

      if (list.length === 0) {
        gridEl.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><p>غذایی با فیلترهای انتخابی شما پیدا نشد.</p></div>`;
        return;
      }

      list.forEach((food) => {
        const isFav = state.settings.favorites.includes(food.id);
        const card = document.createElement('div');
        card.className = 'food-item-card';
        card.innerHTML = `
          <div class="food-top">
            <div class="food-thumb">${getFoodIllustrationSVG(food.category)}</div>
            <div style="flex:1;min-width:0;">
              <div class="flex-between">
                <strong style="font-size:14px;">${escapeHTML(food.name)}</strong>
                <button type="button" class="icon-btn fav-btn" style="width:36px;height:36px;min-width:36px;min-height:36px;color:${isFav ? 'var(--danger)' : 'var(--text-muted)'};" aria-label="افزودن به علاقه‌مندی‌ها">
                  ${ICONS.heart}
                </button>
              </div>
              <div class="text-xs text-muted">${escapeHTML(food.category)} • واحد: ${escapeHTML(food.unit)}</div>
            </div>
          </div>
          <div class="macro-row">
            <div><span class="text-muted">انرژی تخمینی</span><strong>${toPersianDigits(food.calories)} kcal</strong></div>
            <div><span class="text-muted">پروتئین</span><strong>${toPersianDigits(food.protein)}g</strong></div>
            <div><span class="text-muted">کربوهیدرات</span><strong>${toPersianDigits(food.carbs)}g</strong></div>
            <div><span class="text-muted">چربی / فیبر</span><strong>${toPersianDigits(food.fat)} / ${toPersianDigits(food.fiber)}g</strong></div>
          </div>
          <div class="flex-between">
            <span class="text-xs text-muted">${escapeHTML(food.source)}</span>
            <button type="button" class="btn btn-primary btn-sm add-food-btn">${ICONS.plus} انتخاب و ثبت</button>
          </div>
        `;

        card.querySelector('.fav-btn').onclick = () => {
          if (isFav) {
            state.settings.favorites = state.settings.favorites.filter((id) => id !== food.id);
            showToast('از علاقه‌مندی‌ها حذف شد.');
          } else {
            state.settings.favorites.push(food.id);
            showToast('به غذاهای موردعلاقه اضافه شد.', 'success');
          }
          StorageService.setSetting(LS_KEYS.favoriteFoods, state.settings.favorites);
          renderFoodResultsList(gridEl);
        };

        card.querySelector('.add-food-btn').onclick = () => openAddFoodLogModal(food);

        gridEl.appendChild(card);
      });
    }

    function openAddFoodLogModal(food) {
      openModal({
        title: `ثبت «${food.name}» در دفترچه`,
        buildBody: (body) => {
          body.innerHTML = `
            <p class="text-xs text-muted mb-2">واحد پایه: ${escapeHTML(food.unit)} (${escapeHTML(food.source)})</p>
            <div class="form-group">
              <label class="form-label" for="log_meal">انتخاب وعده غذایی *</label>
              <select id="log_meal" class="form-control">
                ${MEAL_TYPES.map((m) => `<option value="${m.id}">${m.label}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="log_servings">تعداد یا ضریب واحد مصرفی *</label>
              <input id="log_servings" class="form-control" type="number" step="0.25" min="0.25" max="20" value="1" />
            </div>
            <div id="liveCalcPreview" class="macro-row"></div>
          `;

          const servInp = body.querySelector('#log_servings');
          const preview = body.querySelector('#liveCalcPreview');
          const updatePreview = () => {
            const s = Math.max(0, Number(servInp.value) || 0);
            preview.innerHTML = `
              <div><span class="text-muted">انرژی</span><strong>${toPersianDigits(Math.round(food.calories * s))} kcal</strong></div>
              <div><span class="text-muted">پروتئین</span><strong>${toPersianDigits(round1(food.protein * s))}g</strong></div>
              <div><span class="text-muted">کربوهیدرات</span><strong>${toPersianDigits(round1(food.carbs * s))}g</strong></div>
              <div><span class="text-muted">چربی / فیبر</span><strong>${toPersianDigits(round1(food.fat * s))} / ${toPersianDigits(round1(food.fiber * s))}g</strong></div>
            `;
          };
          servInp.addEventListener('input', updatePreview);
          updatePreview();
        },
        confirmText: 'ثبت در دفترچه روزانه',
        onConfirm: async () => {
          const mealType = document.getElementById('log_meal').value;
          const servings = Number(document.getElementById('log_servings').value);
          if (!servings || servings <= 0 || servings > 20) {
            showToast('لطفاً مقدار مصرف معتبر (بین ۰.۲۵ تا ۲۰) وارد کنید.', 'danger');
            return false;
          }
          const entry = {
            id: generateId('fd'),
            date: state.selectedDate,
            foodId: food.id,
            foodName: food.name,
            mealType,
            servings,
            calories: Math.round(food.calories * servings),
            protein: round1(food.protein * servings),
            carbs: round1(food.carbs * servings),
            fat: round1(food.fat * servings),
            fiber: round1(food.fiber * servings),
            createdAt: Date.now()
          };
          await StorageService.putItem('foodLogs', entry);
          state.foodLogs.push(entry);
          showToast('غذا در دفترچه روزانه ثبت شد.', 'success');
          renderApp();
        }
      });
    }

    function openEditFoodLogModal(entry) {
      const baseFood = FOOD_DB.find((f) => f.id === entry.foodId);
      const unitCal = baseFood ? baseFood.calories : entry.calories / (entry.servings || 1);
      const unitPro = baseFood ? baseFood.protein : entry.protein / (entry.servings || 1);
      const unitCarb = baseFood ? baseFood.carbs : entry.carbs / (entry.servings || 1);
      const unitFat = baseFood ? baseFood.fat : entry.fat / (entry.servings || 1);
      const unitFib = baseFood ? baseFood.fiber : entry.fiber / (entry.servings || 1);

      openModal({
        title: `ویرایش «${entry.foodName}»`,
        buildBody: (body) => {
          body.innerHTML = `
            <div class="form-group">
              <label class="form-label" for="edit_meal">وعده غذایی</label>
              <select id="edit_meal" class="form-control">
                ${MEAL_TYPES.map((m) => `<option value="${m.id}" ${m.id === entry.mealType ? 'selected' : ''}>${m.label}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="edit_servings">مقدار واحد مصرفی</label>
              <input id="edit_servings" class="form-control" type="number" step="0.25" min="0.25" max="20" value="${entry.servings}" />
            </div>
          `;
        },
        confirmText: 'ذخیره تغییرات',
        onConfirm: async () => {
          const mealType = document.getElementById('edit_meal').value;
          const servings = Number(document.getElementById('edit_servings').value);
          if (!servings || servings <= 0 || servings > 20) {
            showToast('مقدار واحد مصرفی معتبر نیست.', 'danger');
            return false;
          }
          const updated = {
            ...entry,
            mealType,
            servings,
            calories: Math.round(unitCal * servings),
            protein: round1(unitPro * servings),
            carbs: round1(unitCarb * servings),
            fat: round1(unitFat * servings),
            fiber: round1(unitFib * servings)
          };
          await StorageService.putItem('foodLogs', updated);
          state.foodLogs = state.foodLogs.map((f) => (f.id === entry.id ? updated : f));
          showToast('تغییرات با موفقیت ذخیره شد.', 'success');
          renderApp();
        }

    /* =========================================================================
       ۱۳. صفحه مدیریت آب مصرفی (Water Tracker)
       ========================================================================= */
    async function quickLogWater(amountMl, customDate = null) {
      const targetDate = customDate || getTodayISO();
      const amount = Number(amountMl);
      if (!amount || amount < 50 || amount > 3000) {
        showToast('مقدار آب باید بین ۵۰ تا ۳۰۰۰ میلی‌لیتر باشد.', 'danger');
        return;
      }
      const entry = {
        id: generateId('wt_log'),
        date: targetDate,
        amountMl: amount,
        time: new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' }),
        createdAt: Date.now()
      };
      try {
        await StorageService.putItem('waterLogs', entry);
        state.waterLogs.push(entry);
        showToast(`${toPersianDigits(amount)} میلی‌لیتر آب ثبت شد.`, 'success');
        renderApp();
      } catch (e) {
        showToast('خطا در ثبت آب مصرفی.', 'danger');
      }
    }

    function renderWaterPage(container) {
      const today = getTodayISO();
      const daily = getDailySummary(today);
      const metrics = evaluateHealthMetrics(state.profile);
      const goalMl = metrics.suggestedWaterMl;
      const pct = Math.min(100, Math.round((daily.totalWaterMl / goalMl) * 100));
      const glassesCount = round1(daily.totalWaterMl / 250);

        <div class="card-header">

          <span class="badge">${toPersianDigits(pct)}٪ تکمیل شده</span>

        <div class="grid-2" style="align-items:center;">
          <div>
            <div class="stat-value" style="font-size:26px;">

            </div>
            <p class="text-sm text-muted">معادل حدود ${toPersianDigits(glassesCount)} لیوان ۲۵۰ میلی‌لیتری • برآورد روزانه شما: ${toPersianDigits(goalMl)} میلی‌لیتر</p>

          </div>
          <div>
            <div class="flex-row mb-2">
              <button type="button" id="addGlass250" class="btn btn-primary">${ICONS.plus} یک لیوان (۲۵۰ ml)</button>

              <label for="customWaterInp" class="hidden">مقدار دلخواه آب (میلی‌لیتر)</label>

              <button type="submit" class="btn btn-gold">ثبت مقدار</button>
            </form>
          </div>
        </div>
      `;

      mainCard.querySelector('#addBottle500').onclick = () => quickLogWater(500, today);

        const val = Number(mainCard.querySelector('#customWaterInp').value);

      const chartCard = document.createElement('div');
      chartCard.className = 'card';
      chartCard.innerHTML = `<div class="card-header"><h3 class="card-title">${ICONS.reports} روند مصرف آب در ۷ روز گذشته</h3></div><div class="chart-box" id="water7Chart"></div>`;
      container.appendChild(chartCard);

      const last7 = [];

        const dISO = shiftDateISO(today, -i);
        const sumMl = state.waterLogs.filter((w) => w.date === dISO).reduce((s, x) => s + Number(x.amountMl), 0);
        const dt = new Date(dISO);
        const dayName = new Intl.DateTimeFormat('fa-IR', { weekday: 'short' }).format(dt);
        last7.push({ label: dayName, value: sumMl });

      chartCard.querySelector('#water7Chart').appendChild(createBarChartSVG(last7, 'میلی‌لیتر آب', '#701C3C'));

      // لیست ثبت‌های امروز (امکان ویرایش و حذف) + یادآور آب
      const bottomGrid = document.createElement('div');
      bottomGrid.className = 'grid-2';

      const logsCard = document.createElement('div');
      logsCard.className = 'card';
      logsCard.innerHTML = `<div class="card-header"><h3 class="card-title">ثبت‌های آب امروز (${toPersianDigits(daily.waters.length)})</h3></div><div id="todayWaterList"></div>`;

          row.style.padding = '8px 0';
          row.style.borderBottom = '1px solid var(--border-color)';

          const lbl = document.createElement('span');
          lbl.textContent = `${toPersianDigits(w.amountMl)} میلی‌لیتر ${w.time ? `(${w.time})` : ''}`;

          const btns = document.createElement('div');
          btns.className = 'flex-row';

          const editBtn = document.createElement('button');
          editBtn.className = 'btn btn-outline btn-sm';
          editBtn.setAttribute('aria-label', 'ویرایش مقدار آب');
          editBtn.innerHTML = ICONS.edit;
          editBtn.onclick = () => {
            openModal({
              title: 'اصلاح مقدار آب ثبت‌شده',
              buildBody: (b) => {
                b.innerHTML = `<div class="form-group"><label class="form-label" for="editWaterVal">مقدار جدید (میلی‌لیتر)</label><input id="editWaterVal" class="form-control" type="number" min="50" max="2000" value="${w.amountMl}" /></div>`;
              },
              confirmText: 'ذخیره',
              onConfirm: async () => {
                const newVal = Number(document.getElementById('editWaterVal').value);
                if (!newVal || newVal < 50 || newVal > 2000) {
                  showToast('مقدار معتبر نیست.', 'danger');
                  return false;
                }

                await StorageService.putItem('waterLogs', updated);
                state.waterLogs = state.waterLogs.map((x) => (x.id === w.id ? updated : x));

          delBtn.className = 'btn btn-danger btn-sm';
          delBtn.setAttribute('aria-label', 'حذف ثبت آب');

      remCard.innerHTML = `
        <div class="card-header">
          <h3 class="card-title">${ICONS.bell} یادآور هوشمند نوشیدن آب</h3>
          <span class="badge ${rem.enabled ? '' : 'badge-gold'}">${rem.enabled ? 'فعال' : 'غیرفعال'}</span>
        </div>
        <p class="text-sm text-muted mb-2">با فعال‌سازی یادآور، در زمان باز بودن برنامه هر چند دقیقه یک‌بار پیام یادآوری نمایش داده می‌شود.</p>
        <div class="form-group">
          <label class="form-label" for="remIntervalSel">فاصله زمانی یادآوری</label>
          <select id="remIntervalSel" class="form-control">
            <option value="60" ${Number(rem.intervalMin) === 60 ? 'selected' : ''}>هر ۱ ساعت</option>
            <option value="90" ${Number(rem.intervalMin) === 90 ? 'selected' : ''}>هر ۱.۵ ساعت</option>
            <option value="120" ${Number(rem.intervalMin) === 120 ? 'selected' : ''}>هر ۲ ساعت</option>
            <option value="180" ${Number(rem.intervalMin) === 180 ? 'selected' : ''}>هر ۳ ساعت</option>
          </select>
        </div>
        <button type="button" id="toggleRemBtn" class="btn ${rem.enabled ? 'btn-outline' : 'btn-primary'}" style="width:100%;">
          ${rem.enabled ? 'غیرفعال کردن یادآور' : 'فعال کردن یادآور آب'}
        </button>
      `;
      bottomGrid.appendChild(remCard);
      container.appendChild(bottomGrid);

      remCard.querySelector('#toggleRemBtn').onclick = () => {
        const intervalMin = Number(remCard.querySelector('#remIntervalSel').value);
        state.settings.waterReminder = {
          enabled: !rem.enabled,
          intervalMin
        };
        StorageService.setSetting(LS_KEYS.waterReminder, state.settings.waterReminder);
        setupWaterReminderTimer();
        showToast(state.settings.waterReminder.enabled ? 'یادآور آب فعال شد.' : 'یادآور آب غیرفعال شد.', 'success');
        renderApp();
      };
    }

    /* =========================================================================

    /* =========================================================================
       ۱۵. صفحه گزارش‌های آماری (Reports - متصل به داده‌های واقعی کاربر)
       ========================================================================= */
    function renderReportsPage(container) {
      const today = getTodayISO();
      const metrics = evaluateHealthMetrics(state.profile);
      const daysCount = state.reportDays;

      const topCard = document.createElement('div');
      topCard.className = 'card flex-between';
      topCard.innerHTML = `
        <div>
          <h3 class="card-title">${ICONS.reports} گزارش‌های تحلیلی و روند سلامتی</h3>
          <p class="text-xs text-muted">تمام نمودارها مستقیماً از داده‌های واقعی ثبت‌شده شما تولید می‌شوند.</p>
        </div>
        <div class="flex-row">
          <button type="button" id="rep7Btn" class="btn btn-sm ${daysCount === 7 ? 'btn-primary' : 'btn-outline'}">۷ روز گذشته</button>
          <button type="button" id="rep14Btn" class="btn btn-sm ${daysCount === 14 ? 'btn-primary' : 'btn-outline'}">۱۴ روز گذشته</button>
        </div>
      `;
      container.appendChild(topCard);

      topCard.querySelector('#rep7Btn').onclick = () => { state.reportDays = 7; renderApp(); };
      topCard.querySelector('#rep14Btn').onclick = () => { state.reportDays = 14; renderApp(); };

      // آماده‌سازی سری‌های زمانی واقعی
      const dates = [];
      for (let i = daysCount - 1; i >= 0; i--) {
        dates.push(shiftDateISO(today, -i));
      }

      const waterSeries = [];
      const energySeries = [];
      const mealsCountSeries = [];
      const activitySeries = [];

      dates.forEach((dISO) => {
        const s = getDailySummary(dISO);
        const dt = new Date(dISO);
        const lbl = new Intl.DateTimeFormat('fa-IR', { month: 'numeric', day: 'numeric' }).format(dt);
        waterSeries.push({ label: lbl, value: s.totalWaterMl, fullDate: dISO });
        energySeries.push({ label: lbl, value: s.nutrition.calories, fullDate: dISO });
        mealsCountSeries.push({ label: lbl, value: s.foods.length, fullDate: dISO });
        activitySeries.push({ label: lbl, value: s.totalActivityMin, fullDate: dISO });
      });

      const hasAnyData =
        waterSeries.some((x) => x.value > 0) ||
        energySeries.some((x) => x.value > 0) ||
        activitySeries.some((x) => x.value > 0);

      if (!hasAnyData) {
        const empty = document.createElement('div');
        empty.className = 'card empty-state';
        empty.innerHTML = `
          <h4 class="font-bold">هنوز داده‌ای در این بازه زمانی ثبت نشده است</h4>
          <p>با ثبت اولین وعده غذایی، لیوان آب یا فعالیت بدنی، نمودارهای واقعی شما در این بخش ترسیم می‌شوند.</p>
          <button type="button" id="goFoodFromRep" class="btn btn-primary">شروع ثبت اطلاعات امروز</button>
        `;
        container.appendChild(empty);
        empty.querySelector('#goFoodFromRep').onclick = () => navigateTo('food');
        return;
      }

      const chartsGrid = document.createElement('div');
      chartsGrid.className = 'grid-2';

      // ۱. نمودار آب مصرفی
      const c1 = document.createElement('div');
      c1.className = 'card';
      c1.innerHTML = `<h4 class="card-title mb-2">${ICONS.water} ۱. آب مصرفی روزانه (میلی‌لیتر)</h4><div class="chart-box"></div>`;
      c1.querySelector('.chart-box').appendChild(createBarChartSVG(waterSeries, 'آب مصرفی', '#701C3C'));
      chartsGrid.appendChild(c1);

      // ۲. نمودار انرژی (فقط برای بزرگسالان) یا تنوع وعده (برای زیر ۱۸ سال)
      const c2 = document.createElement('div');
      c2.className = 'card';
      if (!metrics.isMinor) {
        c2.innerHTML = `<h4 class="card-title mb-2">${ICONS.food} ۲. انرژی ثبت‌شده روزانه (کالری تخمینی)</h4><div class="chart-box"></div>`;
        c2.querySelector('.chart-box').appendChild(createBarChartSVG(energySeries, 'انرژی روزانه', '#B68D40'));
      } else {
        c2.innerHTML = `<h4 class="card-title mb-2">${ICONS.sparkle} ۲. تعداد اقلام غذایی ثبت‌شده (نوجوانان)</h4><div class="chart-box"></div>`;
        c2.querySelector('.chart-box').appendChild(createBarChartSVG(mealsCountSeries, 'تعداد اقلام', '#B68D40'));
      }
      chartsGrid.appendChild(c2);

      // ۳. نمودار تعداد وعده‌ها
      const c3 = document.createElement('div');
      c3.className = 'card';
      c3.innerHTML = `<h4 class="card-title mb-2">${ICONS.calendar} ۳. تعداد وعده‌ها و میان‌وعده‌های ثبت‌شده</h4><div class="chart-box"></div>`;
      c3.querySelector('.chart-box').appendChild(createBarChartSVG(mealsCountSeries, 'تعداد وعده', '#701C3C'));
      chartsGrid.appendChild(c3);

      // ۴. نمودار فعالیت بدنی
      const c4 = document.createElement('div');
      c4.className = 'card';
      c4.innerHTML = `<h4 class="card-title mb-2">${ICONS.activity} ۴. فعالیت بدنی روزانه (دقیقه)</h4><div class="chart-box"></div>`;
      c4.querySelector('.chart-box').appendChild(createBarChartSVG(activitySeries, 'دقیقه فعالیت', '#1E7E53'));
      chartsGrid.appendChild(c4);

      container.appendChild(chartsGrid);

      // ۵. روند شاخص‌های سلامتی و ثبت وزن اختیاری بزرگسالان
      if (!metrics.isMinor) {
        const weightCard = document.createElement('div');
        weightCard.className = 'card';
        weightCard.innerHTML = `
          <div class="card-header">
            <h4 class="card-title">${ICONS.heart} ۵. روند وزن ثبت‌شده (اختیاری - ویژه بزرگسالان)</h4>
            <button type="button" id="addWeightLogBtn" class="btn btn-soft btn-sm">${ICONS.plus} ثبت وزن جدید</button>
          </div>
          <div id="weightLogsList"></div>
        `;
        container.appendChild(weightCard);

        weightCard.querySelector('#addWeightLogBtn').onclick = () => {
          openModal({
            title: 'ثبت وزن جدید',
            buildBody: (b) => {
              b.innerHTML = `
                <div class="form-group">
                  <label class="form-label" for="newWtInp">وزن فعلی (کیلوگرم)</label>
                  <input id="newWtInp" class="form-control" type="number" step="0.1" min="25" max="300" value="${state.profile.weight}" />
                </div>
              `;
            },
            confirmText: 'ثبت وزن',
            onConfirm: async () => {
              const wt = Number(document.getElementById('newWtInp').value);
              if (!wt || wt < 25 || wt > 300) {
                showToast('مقدار وزن معتبر نیست.', 'danger');
                return false;
              }
              const log = { id: generateId('wt'), date: getTodayISO(), weight: wt, createdAt: Date.now() };
              await StorageService.putItem('weightLogs', log);
              state.weightLogs.push(log);
              state.profile.weight = wt;
              await StorageService.saveProfile(state.profile);
              showToast('وزن جدید ثبت شد.', 'success');
              renderApp();
            }
          });
        };

        const wListEl = weightCard.querySelector('#weightLogsList');
        if (state.weightLogs.length === 0) {
          wListEl.innerHTML = `<p class="text-sm text-muted">هنوز سابقه تغییر وزن ثبت نشده است.</p>`;
        } else {
          const wtPoints = state.weightLogs.slice(-7).map((w) => ({
            label: new Intl.DateTimeFormat('fa-IR', { month: 'numeric', day: 'numeric' }).format(new Date(w.date)),
            value: w.weight
          }));
          wListEl.appendChild(createBarChartSVG(wtPoints, 'کیلوگرم', '#701C3C'));
        }
      }
    }
