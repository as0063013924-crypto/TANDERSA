        const h = document.createElement('div');
        h.className = 'cal-day-header';
        h.textContent = wh;
        grid.appendChild(h);
      });

      const firstDay = new Date(year, month, 1);
      // تبدیل روز هفته میلادی به شنبه=0
      const startPad = (firstDay.getDay() + 1) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < startPad; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-cell empty';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const hasFood = state.foodLogs.some((f) => f.date === iso);
        const hasWater = state.waterLogs.some((w) => w.date === iso);
        const hasAct = state.activityLogs.some((a) => a.date === iso);

        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = `cal-cell ${state.selectedDate === iso ? 'selected' : ''} ${(hasFood || hasWater || hasAct) ? 'has-data' : ''}`;
        cell.textContent = toPersianDigits(d);
        cell.setAttribute('aria-label', formatPersianDate(iso));
        cell.onclick = () => {
          state.selectedDate = iso;
          renderApp();
        };
        grid.appendChild(cell);
      }

      // جزئیات روز انتخاب‌شده و امکان ویرایش
      const selSummary = getDailySummary(state.selectedDate);
      const detailCard = document.createElement('div');
      detailCard.className = 'card';
      detailCard.innerHTML = `
        <div class="card-header">
          <h4 class="card-title">جزئیات ${formatPersianDate(state.selectedDate)}</h4>
          <div class="flex-row">
            <button type="button" id="editDayFoodBtn" class="btn btn-primary btn-sm">${ICONS.edit} افزودن/ویرایش غذا</button>
            <button type="button" id="addDayWaterBtn" class="btn btn-soft btn-sm">${ICONS.plus} ثبت ۲۵۰ml آب</button>
            <button type="button" id="addDayActBtn" class="btn btn-outline btn-sm">${ICONS.plus} ثبت فعالیت</button>
          </div>
        </div>
        <div class="grid-3 mb-3">
          <div class="stat-card"><span class="stat-label">انرژی تخمینی</span><span class="stat-value">${toPersianDigits(selSummary.nutrition.calories)} kcal</span></div>
          <div class="stat-card"><span class="stat-label">آب مصرفی</span><span class="stat-value">${toPersianDigits(selSummary.totalWaterMl)} ml</span></div>
          <div class="stat-card"><span class="stat-label">فعالیت بدنی</span><span class="stat-value">${toPersianDigits(selSummary.totalActivityMin)} دقیقه</span></div>
        </div>
        <div id="histFoodsList"></div>
      `;
      container.appendChild(detailCard);

      detailCard.querySelector('#editDayFoodBtn').onclick = () => navigateTo('food');
      detailCard.querySelector('#addDayWaterBtn').onclick = () => quickLogWater(250, state.selectedDate);
      detailCard.querySelector('#addDayActBtn').onclick = () => openActivityModal(state.selectedDate);

      const hf = detailCard.querySelector('#histFoodsList');
      if (selSummary.foods.length === 0) {
        hf.innerHTML = `<p class="text-sm text-muted">در این تاریخ وعده غذایی ثبت نشده است.</p>`;
      } else {
        selSummary.foods.forEach((item) => {
          const row = document.createElement('div');
          row.className = 'flex-between';
          row.style.padding = '8px 0';
          row.style.borderBottom = '1px solid var(--border-color)';

          const txt = document.createElement('span');
          txt.className = 'text-sm';
          txt.textContent = `${item.foodName} (${toPersianDigits(item.servings)} واحد) — ${toPersianDigits(item.calories)} کالری`;

          const del = document.createElement('button');
          del.className = 'btn btn-danger btn-sm';
          del.innerHTML = ICONS.trash;
          del.setAttribute('aria-label', 'حذف مورد');
          del.onclick = () => confirmDeleteRecord('foodLogs', item.id, item.foodName);

          row.appendChild(txt);
          row.appendChild(del);
          hf.appendChild(row);
        });
      }
    }

    /* =========================================================================
       ۱۷. صفحه پروفایل و تنظیمات کامل (Profile & Settings)
       ========================================================================= */
    function renderProfileAndSettingsPage(container) {
      // بخش اول: ویرایش پروفایل کاربری
      const profileCard = document.createElement('div');
      profileCard.className = 'card';
      profileCard.innerHTML = `<div class="card-header"><h3 class="card-title">${ICONS.profile} پروفایل کاربری تندرسا</h3></div>`;

      const form = buildProfileForm(state.profile, async (updatedProfile) => {
        try {
          await StorageService.saveProfile(updatedProfile);
          state.profile = updatedProfile;
          showToast('اطلاعات پروفایل با موفقیت به‌روزرسانی شد.', 'success');
          renderApp();
        } catch (e) {
          showToast('خطا در ذخیره پروفایل.', 'danger');
        }
      });
      profileCard.appendChild(form);
      container.appendChild(profileCard);

      // بخش دوم: تنظیمات اپلیکیشن، پشتیبان‌گیری JSON و بازنشانی
      const settingsCard = document.createElement('div');
      settingsCard.className = 'card';
      settingsCard.innerHTML = `
        <div class="card-header">
          <h3 class="card-title">${ICONS.settings} تنظیمات، پشتیبان‌گیری و درباره تندرسا</h3>
          <span class="badge">نسخه ۱.۰.۰ پیش‌نمایش</span>
        </div>

        <div class="grid-2 mb-3">
          <div class="form-group">
            <label class="form-label" for="setThemeSel">ظاهر برنامه (تم روشن / تاریک)</label>
            <select id="setThemeSel" class="form-control">
              <option value="light" ${state.settings.theme === 'light' ? 'selected' : ''}>حالت روشن (پالت کرم و زرشکی)</option>
              <option value="dark" ${state.settings.theme === 'dark' ? 'selected' : ''}>حالت تاریک (Dark Mode)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="setUnitSel">واحد نمایش آب مصرفی</label>
            <select id="setUnitSel" class="form-control">
              <option value="metric" ${state.settings.unitSystem === 'metric' ? 'selected' : ''}>میلی‌لیتر (ml)</option>
              <option value="glass" ${state.settings.unitSystem === 'glass' ? 'selected' : ''}>لیوان استاندارد (۲۵۰ میلی‌لیتر)</option>
            </select>
          </div>
        </div>

        <div class="mb-3" style="padding:12px;border:1px solid var(--border-color);border-radius:12px;">
          <h4 class="font-bold mb-2">پشتیبان‌گیری و بازیابی اطلاعات (JSON)</h4>
          <p class="text-xs text-muted mb-2">تمام داده‌های شما فقط روی دستگاه خودتان نگهداری می‌شود. می‌توانید یک فایل پشتیبان JSON دانلود کنید یا فایل قبلی را بازیابی نمایید.</p>
          <div class="flex-row">
            <button type="button" id="exportJsonBtn" class="btn btn-soft">خروجی گرفتن از اطلاعات (Export JSON)</button>
            <label class="btn btn-outline" style="cursor:pointer;">
              بازیابی اطلاعات (Import JSON)
              <input type="file" id="importJsonInput" accept=".json,application/json" class="hidden" />
            </label>
          </div>
        </div>

        <div class="mb-3" style="padding:12px;border:1px solid var(--danger);border-radius:12px;background:var(--danger-bg);">
          <h4 class="font-bold" style="color:var(--danger);">حذف کامل اطلاعات محلی</h4>
          <p class="text-xs mb-2">با اجرای این گزینه، پروفایل و تمام سوابق ثبت‌شده غذا، آب و فعالیت از این مرورگر پاک می‌شوند.</p>
          <button type="button" id="wipeAllDataBtn" class="btn btn-danger btn-sm">${ICONS.trash} حذف کامل اطلاعات و بازنشانی</button>
        </div>

        <div style="padding-top:12px;border-top:1px solid var(--border-color);">
          <div class="flex-row mb-2">
            ${ICONS.logo}
            <div>
              <strong>تندرسا | TANDERSA</strong>
              <div class="text-xs text-muted">«هر روز، یک قدم به سوی زندگی سالم‌تر» — طراحی‌شده با معماری Local-First و بدون ارسال داده به سرور</div>
            </div>
          </div>
        </div>
      `;
      container.appendChild(settingsCard);

      settingsCard.querySelector('#setThemeSel').onchange = (e) => {
        applyTheme(e.target.value);
        showToast('تم برنامه تغییر کرد.');
      };

      settingsCard.querySelector('#setUnitSel').onchange = (e) => {
        state.settings.unitSystem = e.target.value;
        StorageService.setSetting(LS_KEYS.unitSystem, e.target.value);
        showToast('واحد اندازه‌گیری ذخیره شد.', 'success');
      };

      // خروجی JSON
      settingsCard.querySelector('#exportJsonBtn').onclick = () => {
        try {
          const payload = {
            app: 'TANDERSA',
            version: '1.0.0',
            exportedAt: new Date().toISOString(),
            profile: state.profile,
            foodLogs: state.foodLogs,
            waterLogs: state.waterLogs,
            activityLogs: state.activityLogs,
            weightLogs: state.weightLogs
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `tandersa-backup-${getTodayISO()}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('فایل پشتیبان JSON آماده و دانلود شد.', 'success');
        } catch (err) {
          showToast('خطا در تهیه خروجی JSON.', 'danger');
        }
      };

      // بازیابی JSON با اعتبارسنجی
      settingsCard.querySelector('#importJsonInput').onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (!parsed || parsed.app !== 'TANDERSA' || !parsed.profile) {
              throw new Error('ساختار فایل پشتیبان متعلق به تندرسا نیست.');
            }
            await StorageService.clearAllStores();
            await StorageService.saveProfile(parsed.profile);
            if (Array.isArray(parsed.foodLogs)) {
              for (const item of parsed.foodLogs) await StorageService.putItem('foodLogs', item);
            }
            if (Array.isArray(parsed.waterLogs)) {
              for (const item of parsed.waterLogs) await StorageService.putItem('waterLogs', item);
            }
            if (Array.isArray(parsed.activityLogs)) {
              for (const item of parsed.activityLogs) await StorageService.putItem('activityLogs', item);
            }
            if (Array.isArray(parsed.weightLogs)) {
              for (const item of parsed.weightLogs) await StorageService.putItem('weightLogs', item);
            }
            await loadAllDataFromDB();
            showToast('اطلاعات پشتیبان با موفقیت بازیابی شد.', 'success');
            renderApp();
          } catch (err) {
            showToast('خطا در خواندن یا اعتبارسنجی فایل JSON.', 'danger');
          }
        };
        reader.readAsText(file);
      };

      // حذف کامل اطلاعات با تأیید کاربر
      settingsCard.querySelector('#wipeAllDataBtn').onclick = () => {
        openModal({
          title: 'تأیید حذف کامل اطلاعات محلی',
          buildBody: (b) => {
            const p = document.createElement('p');
            p.textContent = 'آیا مطمئن هستید که می‌خواهید تمام اطلاعات پروفایل، غذاها، آب و گزارش‌های ذخیره‌شده در این دستگاه را برای همیشه حذف کنید؟ این عملیات قابل بازگشت نیست.';
            b.appendChild(p);
          },
          confirmText: 'بله، همه اطلاعات حذف شوند',
          confirmClass: 'btn-danger',
          onConfirm: async () => {
            try {
              await StorageService.clearAllStores();
              localStorage.removeItem(LS_KEYS.favoriteFoods);
              state.profile = null;
              state.foodLogs = [];
              state.waterLogs = [];
              state.activityLogs = [];
              state.weightLogs = [];
              state.settings.favorites = [];
              showToast('تمام اطلاعات محلی پاک شد.');
              renderApp();
            } catch (e) {
              showToast('خطا در حذف اطلاعات.', 'danger');
            }
          }
        });
      };
    }

    /* =========================================================================
       ۱۸. تأییدیه حذف رکوردهای تکی و توابع ناوبری
       ========================================================================= */
    function confirmDeleteRecord(storeName, id, label) {
      openModal({
        title: 'تأیید حذف مورد',
        buildBody: (body) => {
          const p = document.createElement('p');
          p.textContent = `آیا از حذف «${label}» اطمینان دارید؟`;
          body.appendChild(p);
        },
        confirmText: 'حذف شود',
        confirmClass: 'btn-danger',
        onConfirm: async () => {
          try {
            await StorageService.deleteItem(storeName, id);
            state[storeName] = state[storeName].filter((item) => item.id !== id);
            showToast('مورد انتخاب‌شده حذف شد.');
            renderApp();
          } catch (e) {
            showToast('خطا در حذف رکورد.', 'danger');
          }
        }
      });
    }

    function navigateTo(pageId) {
      state.activePage = pageId;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderApp();
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str == null ? '' : String(str);
      return div.innerHTML;
    }

    /* =========================================================================
       ۱۹. رندر پوسته اصلی برنامه (Header + Sidebar + BottomNav + Content)
       ========================================================================= */
    function renderApp() {
      const root = document.getElementById('appRoot');
      root.innerHTML = '';

      if (state.loading) {
        root.innerHTML = `<div class="onboarding-wrap"><div class="card empty-state"><p>در حال بارگذاری پایگاه داده محلی تندرسا...</p></div></div>`;
        return;
      }

      if (state.error) {
        root.innerHTML = `<div class="onboarding-wrap"><div class="alert-box alert-danger"><div>${escapeHTML(state.error)}</div></div></div>`;
        return;
      }

      // اگر هنوز پروفایل اولیه تکمیل نشده، صفحه خوشامدگویی را نشان بده
      if (!state.profile) {
        renderOnboarding(root);
        return;
      }

      const shell = document.createElement('div');
      shell.className = 'app-shell';

      const navItems = [
        { id: 'dashboard', label: 'خانه', icon: ICONS.home, inBottom: true },
        { id: 'food', label: 'ثبت غذا', icon: ICONS.food, inBottom: true },
        { id: 'water', label: 'آب', icon: ICONS.water, inBottom: true },
        { id: 'reports', label: 'گزارش‌ها', icon: ICONS.reports, inBottom: true },
        { id: 'suggestions', label: 'پیشنهاد غذایی', icon: ICONS.sparkle, inBottom: false },
        { id: 'history', label: 'تاریخچه', icon: ICONS.calendar, inBottom: false },
        { id: 'profile', label: 'پروفایل و تنظیمات', shortLabel: 'پروفایل', icon: ICONS.profile, inBottom: true }
      ];

      // منوی کناری دسکتاپ
      const sidebar = document.createElement('aside');
      sidebar.className = 'sidebar';
      sidebar.innerHTML = `
        <div class="brand-box">
          ${ICONS.logo}
          <div class="brand-title-group">
            <div class="brand-name">تندرسا <span class="brand-en">TANDERSA</span></div>
            <div class="brand-sub">مدیریت تغذیه و سبک زندگی</div>
          </div>
        </div>
        <nav class="side-nav-list" aria-label="منوی اصلی دسکتاپ"></nav>
      `;
      const sideNavList = sidebar.querySelector('.side-nav-list');
      navItems.forEach((item) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `nav-item ${state.activePage === item.id ? 'active' : ''}`;
        btn.innerHTML = `${item.icon}<span>${item.label}</span>`;
        btn.onclick = () => navigateTo(item.id);
        sideNavList.appendChild(btn);
      });
      shell.appendChild(sidebar);

      // بخش اصلی
      const mainWrapper = document.createElement('div');
      mainWrapper.className = 'main-wrapper';

      const topbar = document.createElement('header');
      topbar.className = 'topbar';
      topbar.innerHTML = `
        <div class="brand-box">
          ${ICONS.logo}
          <div class="brand-title-group">
            <div class="brand-name">تندرسا <span class="brand-en">TANDERSA</span></div>
            <div class="brand-sub">هر روز، یک قدم به سوی زندگی سالم‌تر</div>
          </div>
        </div>
        <div class="topbar-actions">
          <button type="button" id="topSugBtn" class="icon-btn" aria-label="پیشنهادهای غذایی هوشمند" title="پیشنهادهای غذایی">${ICONS.sparkle}</button>
          <button type="button" id="topHistBtn" class="icon-btn" aria-label="تقویم تاریخچه" title="تقویم تاریخچه">${ICONS.calendar}</button>
          <button type="button" id="topThemeBtn" class="icon-btn" aria-label="تغییر تم روشن و تاریک" title="تغییر تم">
            ${state.settings.theme === 'dark' ? ICONS.sun : ICONS.moon}
          </button>
        </div>
      `;
      mainWrapper.appendChild(topbar);

      topbar.querySelector('#topSugBtn').onclick = () => navigateTo('suggestions');
      topbar.querySelector('#topHistBtn').onclick = () => navigateTo('history');
      topbar.querySelector('#topThemeBtn').onclick = () => {
        const next = state.settings.theme === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        renderApp();
      };

      const contentContainer = document.createElement('main');
      contentContainer.className = 'container';

      switch (state.activePage) {
        case 'food':
          renderFoodPage(contentContainer);
          break;
        case 'water':
          renderWaterPage(contentContainer);
          break;
        case 'reports':
          renderReportsPage(contentContainer);
          break;
        case 'suggestions':
          renderSuggestionsPage(contentContainer);
          break;
        case 'history':
          renderHistoryPage(contentContainer);
          break;
        case 'profile':
          renderProfileAndSettingsPage(contentContainer);
          break;
        case 'dashboard':
        default:
          renderDashboard(contentContainer);
          break;
      }

      mainWrapper.appendChild(contentContainer);
      shell.appendChild(mainWrapper);

      // منوی پایین صفحه موبایل (دقیقاً ۵ گزینه اصلی: خانه، ثبت غذا، آب، گزارش‌ها، پروفایل)
      const bottomNav = document.createElement('nav');
      bottomNav.className = 'bottom-nav';
      bottomNav.setAttribute('aria-label', 'منوی پایین موبایل');

      navItems.filter((i) => i.inBottom).forEach((item) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `bottom-nav-btn ${state.activePage === item.id ? 'active' : ''}`;
        btn.innerHTML = `${item.icon}<span>${item.shortLabel || item.label}</span>`;
        btn.onclick = () => navigateTo(item.id);
        bottomNav.appendChild(btn);
      });

      shell.appendChild(bottomNav);
      root.appendChild(shell);
    }

    /* =========================================================================
       ۲۰. راه‌اندازی اولیه اپلیکیشن و بازیابی داده‌ها از IndexedDB
       ========================================================================= */
    async function loadAllDataFromDB() {
      const [profile, foodLogs, waterLogs, activityLogs, weightLogs] = await Promise.all([
        StorageService.getProfile(),
        StorageService.getAll('foodLogs'),
        StorageService.getAll('waterLogs'),
        StorageService.getAll('activityLogs'),
        StorageService.getAll('weightLogs')
      ]);
      state.profile = profile || null;
      state.foodLogs = foodLogs || [];
      state.waterLogs = waterLogs || [];
      state.activityLogs = activityLogs || [];
      state.weightLogs = weightLogs || [];
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        await StorageService.init();
        await loadAllDataFromDB();
        setupWaterReminderTimer();
        state.loading = false;
      } catch (err) {
        state.loading = false;
        state.error = err.message || 'خطا در راه‌اندازی حافظه محلی برنامه.';
      }
      renderApp();
    });
  </script>
  
<!-- TANDERSA SERVICE WORKER REGISTRATION -->

<script>
  if ('serviceWorker' in navigator) {

    window.addEventListener('load', async () => {

      try {

        const registration =
          await navigator.serviceWorker.register(
            './service-worker.js',
            {
              scope: './'
            }
          );

        console.log(
          'TANDERSA: PWA successfully registered.',
          registration.scope
        );

      } catch (error) {

        console.error(
          'TANDERSA: Service Worker registration failed:',
          error
        );

      }

    });

  }
</script>
